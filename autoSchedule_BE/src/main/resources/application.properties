spring.application.name=autoschedule

# ==========================================
# MySQL DB ?? ??
# ==========================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/autoschedule?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234

# ==========================================
# JPA(Hibernate) ??
# ==========================================
# update: Entity ???? DB ???? ???? ????? ???????.
spring.jpa.hibernate.ddl-auto=update

# SQL logging (incl. bound values) is only on in the dev profile: application-dev.properties

# ==========================================
# JWT (values come from environment variables)
# ==========================================

# HS256 secret, at least 32 bytes
jwt.secret=${JWT_SECRET}
jwt.access-ttl-seconds=1800
jwt.refresh-ttl-seconds=1209600

# HTTPS 로 배포할 때만 true (로컬 http 개발은 false)
auth.cookie-secure=${COOKIE_SECURE:false}

# Allowed frontend origins for CORS, comma separated (e.g. https://app.example.com). Empty = same origin only.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Only /actuator/health is exposed (status only, includes the DB check)
management.endpoints.web.exposure.include=health


# Gemini (AI schedule generation). Key stays server-side only.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash,gemini-2.5-flash,gemini-3.5-flash-lite}
gemini.timeout-seconds=150
# Whole generation (first call + corrections) stops making new calls after this
gemini.total-budget-seconds=180


# Local secrets (git-ignored). Overrides jwt.secret above when present; copy application-secret.example.yml.
spring.config.import=optional:classpath:application-secret.yml

# AI provider: ollama (default, Ollama-compatible /api/chat) or gemini
ai.provider=${AI_PROVIDER:ollama}
llm.base-url=${LLM_BASE_URL:https://ai.ruraeru.xyz}
llm.model=${LLM_MODEL:qwen3.5:9b}
# Bearer token, server-side only
llm.api-key=${LLM_API_KEY:}
# The prompt is the whole month as JSON, so give it more context than the frontend's 8192
llm.num-ctx=${LLM_NUM_CTX:16384}
llm.timeout-seconds=${LLM_TIMEOUT_SECONDS:300}
